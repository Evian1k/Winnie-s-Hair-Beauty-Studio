<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C3A"/>
      <stop offset="60%" stop-color="#1A6B52"/>
      <stop offset="100%" stop-color="#2A7D5F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A7B3F"/>
      <stop offset="50%" stop-color="#C9A961"/>
      <stop offset="100%" stop-color="#E5C885"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="98" fill="url(#bgGrad)"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#FFFFFF" stroke-width="0.4" opacity="0.2"/>

  <circle cx="100" cy="14" r="1.5" fill="#C9A961" opacity="0.8"/>
  <circle cx="100" cy="186" r="1.5" fill="#C9A961" opacity="0.8"/>
  <circle cx="14" cy="100" r="1.5" fill="#C9A961" opacity="0.8"/>
  <circle cx="186" cy="100" r="1.5" fill="#C9A961" opacity="0.8"/>

  <!-- Scissors at top -->
  <g transform="translate(100, 52)" stroke="url(#goldGrad)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-8" cy="-4" r="5"/>
    <circle cx="8" cy="-4" r="5"/>
    <line x1="-4" y1="1" x2="6" y2="13"/>
    <line x1="4" y1="1" x2="-6" y2="13"/>
  </g>

  <!-- L monogram -->
  <text x="100" y="128" text-anchor="middle"
        font-family="Cormorant Garamond, Georgia, serif"
        font-size="76"
        font-weight="600"
        fill="url(#goldGrad)">L</text>

  <!-- Divider -->
  <g transform="translate(100, 152)">
    <line x1="-26" y1="0" x2="-6" y2="0" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.7"/>
    <circle cx="0" cy="0" r="1.5" fill="#C9A961" opacity="0.9"/>
    <line x1="6" y1="0" x2="26" y2="0" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.7"/>
  </g>

  <text x="100" y="172" text-anchor="middle"
        font-family="Cormorant SC, Georgia, serif"
        font-size="9"
        letter-spacing="3"
        fill="#C9A961"
        opacity="0.85">EST. 2014</text>

  <text x="100" y="184" text-anchor="middle"
        font-family="Cormorant SC, Georgia, serif"
        font-size="6"
        letter-spacing="2"
        fill="#FFFFFF"
        opacity="0.5">SYOKIMAU · KENYA</text>
</svg>
