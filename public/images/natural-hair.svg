<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <linearGradient id="bg-natural-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7"/>
      <stop offset="100%" stop-color="#F4B8C4" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="icon-natural-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B76E79"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg-natural-hair)"/>

  <!-- Decorative corners -->
  <g stroke="#D4AF37" stroke-width="1" opacity="0.3" fill="none">
    <path d="M 20 20 L 20 40 M 20 20 L 40 20"/>
    <path d="M 380 20 L 380 40 M 380 20 L 360 20"/>
    <path d="M 20 480 L 20 460 M 20 480 L 40 480"/>
    <path d="M 380 480 L 380 460 M 380 480 L 360 480"/>
  </g>

  <!-- W monogram at top -->
  <circle cx="200" cy="80" r="32" fill="url(#icon-natural-hair)"/>
  <text x="200" y="92" text-anchor="middle"
        font-family="Georgia, serif" font-size="28" font-weight="bold"
        fill="white">W</text>

  <!-- Category icon -->
  <g transform="translate(200, 280)">
    <g transform="translate(-30, -30) scale(2.5)" stroke="url(#icon-natural-hair)" stroke-width="2"
       fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2C8 6 6 10 6 14a6 6 0 0012 0c0-4-2-8-6-12z"/>
    </g>
  </g>

  <!-- Label -->
  
      <text x="200" y="180" text-anchor="middle"
            font-family="Georgia, serif" font-size="20" font-weight="600"
            fill="#B76E79">Natural Hair</text>

  <!-- Divider -->
  <g transform="translate(200, 240)">
    <line x1="-40" y1="0" x2="-8" y2="0" stroke="#D4AF37" stroke-width="0.8" opacity="0.6"/>
    <circle cx="0" cy="0" r="2" fill="#D4AF37" opacity="0.8"/>
    <line x1="8" y1="0" x2="40" y2="0" stroke="#D4AF37" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- Footer text -->
  <text x="200" y="440" text-anchor="middle"
        font-family="Georgia, serif" font-size="10"
        letter-spacing="2" fill="#8B7B8B" opacity="0.7">WINNIE'S HAIR &amp; BEAUTY STUDIO</text>
  <text x="200" y="460" text-anchor="middle"
        font-family="Georgia, serif" font-size="8"
        letter-spacing="1.5" fill="#8B7B8B" opacity="0.5">Replace with your photo via Cloudinary</text>
</svg>
