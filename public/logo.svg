<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" fill="none">
  <defs>
    <linearGradient id="lockupBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B76E79"/>
      <stop offset="50%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="lockupGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B76E79"/>
      <stop offset="50%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <radialGradient id="lockupRose" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFE8EC"/>
      <stop offset="60%" stop-color="#F4B8C4"/>
      <stop offset="100%" stop-color="#B76E79"/>
    </radialGradient>
  </defs>

  <!-- ===== Emblem (left) ===== -->
  <g transform="translate(80, 80)">
    <!-- Outer gold disc -->
    <circle cx="0" cy="0" r="72" fill="url(#lockupBg)"/>
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="67" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.35"/>
    <!-- Compass dots -->
    <circle cx="0" cy="-68" r="1.2" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="0" cy="68" r="1.2" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="-68" cy="0" r="1.2" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="68" cy="0" r="1.2" fill="#FFFFFF" opacity="0.8"/>

    <!-- Rose accent -->
    <g transform="translate(0, -34)">
      <ellipse cx="-5" cy="-1" rx="4" ry="6" fill="url(#lockupRose)" opacity="0.85" transform="rotate(-35)"/>
      <ellipse cx="5" cy="-1" rx="4" ry="6" fill="url(#lockupRose)" opacity="0.85" transform="rotate(35)"/>
      <ellipse cx="0" cy="-5" rx="4" ry="5" fill="url(#lockupRose)"/>
      <circle cx="0" cy="0" r="1.8" fill="#D4AF37"/>
    </g>

    <!-- W -->
    <text x="0" y="22" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="58"
          font-weight="bold"
          fill="#FFFFFF">W</text>

    <!-- Divider -->
    <g transform="translate(0, 38)">
      <line x1="-18" y1="0" x2="-4" y2="0" stroke="#FFFFFF" stroke-width="0.5" opacity="0.7"/>
      <circle cx="0" cy="0" r="1" fill="#FFFFFF" opacity="0.9"/>
      <line x1="4" y1="0" x2="18" y2="0" stroke="#FFFFFF" stroke-width="0.5" opacity="0.7"/>
    </g>

    <text x="0" y="52" text-anchor="middle"
          font-family="Georgia, serif"
          font-size="6"
          letter-spacing="3"
          fill="#FFFFFF"
          opacity="0.85">EST. 2019</text>
  </g>

  <!-- ===== Wordmark (right) ===== -->
  <g transform="translate(180, 80)">
    <!-- Winnie's -->
    <text x="0" y="0" text-anchor="start"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="44"
          font-weight="600"
          fill="url(#lockupGold)">Winnie's</text>

    <!-- Decorative divider with center dot -->
    <g transform="translate(0, 18)">
      <line x1="0" y1="0" x2="180" y2="0" stroke="url(#lockupGold)" stroke-width="0.6" opacity="0.5"/>
      <circle cx="90" cy="0" r="2" fill="url(#lockupGold)"/>
    </g>

    <!-- HAIR & BEAUTY STUDIO -->
    <text x="0" y="40" text-anchor="start"
          font-family="Georgia, serif"
          font-size="11"
          letter-spacing="6"
          fill="#B76E79"
          opacity="0.9">HAIR &amp; BEAUTY STUDIO</text>

    <!-- Katani · Kenya -->
    <text x="0" y="58" text-anchor="start"
          font-family="Georgia, serif"
          font-size="8"
          letter-spacing="3"
          fill="#999999">KATANI · KENYA</text>
  </g>
</svg>
